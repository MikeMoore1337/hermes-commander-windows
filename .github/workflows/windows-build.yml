name: Windows unsigned build verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.10'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.403'
      - name: Validate boundaries and build unsigned candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'BOUNDARY_TESTS_FAILED' }
          & ./tests/test-notice-gate.ps1
          $evidence = Join-Path $env:RUNNER_TEMP 'h454-build-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'h454-build-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'VENV_FAILED' }
          $env:PATH = "$(Join-Path $venv 'Scripts');$env:PATH"
          $wheels = Join-Path $env:RUNNER_TEMP 'h454-build-wheels'
          python -m pip download --disable-pip-version-check --no-cache-dir --no-deps --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --dest $wheels -r requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'WHEEL_DOWNLOAD_FAILED' }
          python -B scripts/audit_build_wheels.py $wheels (Join-Path $evidence 'wheel-notices')
          if ($LASTEXITCODE -ne 0) { throw 'WHEEL_AUDIT_FAILED' }
          $wheelNotices = Join-Path $evidence 'wheel-notices'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $wheelNotices 'wheels.json') | ConvertFrom-Json
          for ($i = 0; $i -lt $manifest.Count; $i++) {
            $wheelDir = [IO.Path]::GetFileNameWithoutExtension($manifest[$i].wheel)
            if ($wheelDir -cnotmatch '^[A-Za-z0-9_.-]+$') { throw 'UNSAFE_WHEEL_NAME' }
            for ($j = 0; $j -lt $manifest[$i].license_paths.Count; $j++) {
              $name = [IO.Path]::GetFileName($manifest[$i].license_paths[$j].Replace('/', '\'))
              if ($name -cnotmatch '^[A-Za-z0-9_.-]+$') { throw 'UNSAFE_NOTICE_NAME' }
              $stored = Join-Path (Join-Path 'third_party_notices/wheels' $wheelDir) $name
              $actual = Join-Path $wheelNotices ('{0:D2}-{1:D2}.txt' -f $i, $j)
              if (-not (Test-Path -LiteralPath $stored -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $stored).Hash -cne (Get-FileHash -LiteralPath $actual).Hash) {
                throw 'WHEEL_NOTICE_MISMATCH'
              }
            }
          }
          $env:PIP_NO_INDEX = '1'
          $env:PIP_FIND_LINKS = $wheels
          $out = Join-Path $env:RUNNER_TEMP 'h454-standalone-service'
          dotnet publish 'deploy/h454/native-windows-service/HermesCommanderNativeService.csproj' --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false "-p:SourceRevisionId=$env:GITHUB_SHA" -o $out
          if ($LASTEXITCODE -ne 0) { throw 'SERVICE_BUILD_FAILED' }
          $service = Join-Path $out 'HermesCommanderNativeService.exe'
          @(Get-ChildItem -LiteralPath $out -File | ForEach-Object { [pscustomobject]@{ name = $_.Name; size = $_.Length } }) |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'dotnet-publish-files.json') -Encoding utf8
          $pythonHome = (python -c "import sys; print(sys.base_prefix)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $env:DOTNET_ROOT) { throw 'RUNTIME_NOTICE_PATH_FAILED' }
          python -c "import json,sys; from pathlib import Path; from scripts.inspect_payload import inspect_dotnet; print(json.dumps(inspect_dotnet(Path(sys.argv[1]).read_bytes())['dependency_libraries']))" $service |
            Set-Content -LiteralPath (Join-Path $evidence 'service-dependencies.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'SERVICE_DEPENDENCIES_FAILED' }
          $dependencies = Get-Content -Raw -LiteralPath (Join-Path $evidence 'service-dependencies.json') | ConvertFrom-Json
          $pack = @($dependencies | Where-Object { $_ -cmatch '^runtimepack\.Microsoft\.NETCore\.App\.Runtime\.win-x64/[0-9.]+$' })
          if ($pack.Count -ne 1) { throw 'RUNTIMEPACK_IDENTITY_MISSING' }
          $packVersion = ($pack[0] -split '/')[1]
          $nugetRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $packDir = Join-Path (Join-Path $nugetRoot 'microsoft.netcore.app.runtime.win-x64') $packVersion
          $notices = Join-Path $out 'ThirdPartyNotices.zip'
          python -B scripts/assemble_notices.py $env:GITHUB_WORKSPACE $pythonHome $env:DOTNET_ROOT $packDir $notices
          if ($LASTEXITCODE -ne 0) { throw 'NOTICE_ASSEMBLY_FAILED' }
          $probe = Start-Process -FilePath $service -ArgumentList @('--self-test', $env:GITHUB_SHA) -Wait -PassThru -NoNewWindow
          if ($probe.ExitCode -ne 0) { throw 'SERVICE_SELF_TEST_FAILED' }
          $workerDir = Join-Path $env:RUNNER_TEMP 'h454-standalone-worker'
          & ./scripts/h454_package_win32_worker.ps1 -ExpectedSha $env:GITHUB_SHA -Destination $workerDir
          if ($LASTEXITCODE -ne 0) { throw 'WORKER_BUILD_FAILED' }
          $tools = Join-Path $env:RUNNER_TEMP 'h454-standalone-wix'
          dotnet tool install wix --version 6.0.0 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw 'WIX_INSTALL_FAILED' }
          $msi = Join-Path $out 'HermesCommanderNative-Disabled.msi'
          & (Join-Path $tools 'wix.exe') build 'deploy/h454/native-windows-msi/Package.wxs' -arch x64 -d "ServiceExe=$service" -d "WorkerExe=$(Join-Path $workerDir 'HermesCommanderNativeWorker.exe')" -d "NoticesZip=$notices" -out $msi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw 'MSI_BUILD_FAILED' }
          if ((Get-AuthenticodeSignature -LiteralPath $msi).Status -ne 'NotSigned') { throw 'UNEXPECTED_MSI_SIGNATURE' }
          $worker = Join-Path $workerDir 'HermesCommanderNativeWorker.exe'
          & pyi-archive_viewer -b -r $worker | Set-Content -LiteralPath (Join-Path $evidence 'worker-archive-list.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'WORKER_INVENTORY_FAILED' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $service,$worker,$notices,$msi |
            ForEach-Object { "$(Split-Path -Leaf $_.Path) $($_.Hash.ToLowerInvariant())" } |
            Set-Content -LiteralPath (Join-Path $evidence 'candidate-sha256.txt') -Encoding utf8
          python -c "import importlib.metadata as m,json; names=['pyinstaller','websockets','altgraph','packaging','pefile','pyinstaller-hooks-contrib','pywin32-ctypes','setuptools']; print(json.dumps([{'name':n,'version':m.version(n),'license_expression':m.metadata(n).get('License-Expression'),'license_files':m.metadata(n).get_all('License-File',[])} for n in names],indent=2))" |
            Set-Content -LiteralPath (Join-Path $evidence 'python-build-distributions.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'DISTRIBUTION_INVENTORY_FAILED' }
          python -c "import json,ssl,sys; print(json.dumps({'python':sys.version.split()[0],'openssl':ssl.OPENSSL_VERSION},indent=2))" |
            Set-Content -LiteralPath (Join-Path $evidence 'python-runtime-versions.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'RUNTIME_VERSION_FAILED' }
          python -c "import ssl; assert ssl.OPENSSL_VERSION.split(' ',2)[:2] == ['OpenSSL','3.5.9']"
          if ($LASTEXITCODE -ne 0) { throw 'OPENSSL_VERSION_CHANGED_REVIEW_NOTICE' }
          Copy-Item -LiteralPath 'third_party_notices/openssl-3.5.9/LICENSE.txt' -Destination (Join-Path $evidence 'openssl-license.txt')
          $nativeInputs = @('python314.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'DLLs\libcrypto-3.dll', 'DLLs\libssl-3.dll', 'DLLs\libffi-8.dll')
          $nativeRecords = foreach ($name in $nativeInputs) {
            $file = Join-Path $pythonHome $name
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              $item = Get-Item -LiteralPath $file
              [pscustomobject]@{ name = $name; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant(); file_version = $item.VersionInfo.FileVersion }
            } else {
              [pscustomobject]@{ name = $name; sha256 = $null; file_version = $null }
            }
          }
          $nativeRecords | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'python-native-inputs.json') -Encoding utf8
          $runtimeNotices = @(
            @{ Source = (Join-Path $pythonHome 'LICENSE.txt'); Name = 'python-license.txt' },
            @{ Source = (Join-Path $env:DOTNET_ROOT 'LICENSE.txt'); Name = 'dotnet-license.txt' },
            @{ Source = (Join-Path $env:DOTNET_ROOT 'ThirdPartyNotices.txt'); Name = 'dotnet-third-party-notices.txt' }
          )
          foreach ($notice in $runtimeNotices) {
            if (Test-Path -LiteralPath $notice.Source -PathType Leaf) {
              Copy-Item -LiteralPath $notice.Source -Destination (Join-Path $evidence $notice.Name)
            } else {
              Add-Content -LiteralPath (Join-Path $evidence 'missing-runtime-notices.txt') -Value $notice.Name
            }
          }
          $extract = Join-Path $env:RUNNER_TEMP 'h454-msi-admin-extract'
          $unpack = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList @('/a', $msi, '/qn', '/norestart', "TARGETDIR=$extract") -WindowStyle Hidden -Wait -PassThru
          if ($unpack.ExitCode -ne 0) { throw 'MSI_ADMIN_EXTRACTION_FAILED' }
          $files = @(Get-ChildItem -LiteralPath $extract -Recurse -File)
          $serviceInMsi = @($files | Where-Object { $_.Name -ceq 'HermesCommanderNativeService.exe' })
          $workerInMsi = @($files | Where-Object { $_.Name -ceq 'HermesCommanderNativeWorker.exe' })
          $noticesInMsi = @($files | Where-Object { $_.Name -ceq 'ThirdPartyNotices.zip' })
          if ($serviceInMsi.Count -ne 1 -or $workerInMsi.Count -ne 1 -or $noticesInMsi.Count -ne 1 -or
              (Get-FileHash -LiteralPath $serviceInMsi[0].FullName).Hash -cne (Get-FileHash -LiteralPath $service).Hash -or
              (Get-FileHash -LiteralPath $workerInMsi[0].FullName).Hash -cne (Get-FileHash -LiteralPath $worker).Hash -or
              (Get-FileHash -LiteralPath $noticesInMsi[0].FullName).Hash -cne (Get-FileHash -LiteralPath $notices).Hash) {
            throw 'MSI_PAYLOAD_MISMATCH'
          }
          @($files | ForEach-Object { [pscustomobject]@{name = [IO.Path]::GetRelativePath($extract, $_.FullName); sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()} }) |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'msi-admin-files.json') -Encoding utf8
          $analysisToc = Join-Path $env:RUNNER_TEMP 'h454-win32-pyinstaller\work\HermesCommanderNativeWorker\Analysis-00.toc'
          $nativeFiles = Join-Path $env:RUNNER_TEMP 'h454-worker-native-files'
          python -B scripts/inspect_payload.py $serviceInMsi[0].FullName $workerInMsi[0].FullName (Join-Path $evidence 'python-native-inputs.json') $analysisToc $packDir $nativeFiles (Join-Path $evidence 'embedded-payload.json')
          if ($LASTEXITCODE -ne 0) { throw 'EMBEDDED_PAYLOAD_INSPECTION_FAILED' }
          @(Get-ChildItem -LiteralPath $nativeFiles -File | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            [pscustomobject]@{ sha256 = $_.BaseName; status = $signature.Status.ToString(); signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }; company = $_.VersionInfo.CompanyName; product = $_.VersionInfo.ProductName; version = $_.VersionInfo.FileVersion }
          }) | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'worker-native-signatures.json') -Encoding utf8
          $payload = Get-Content -Raw -LiteralPath (Join-Path $evidence 'embedded-payload.json') | ConvertFrom-Json
          $extractedPack = @($payload.dotnet_bundle.dependency_libraries | Where-Object { $_ -cmatch '^runtimepack\.Microsoft\.NETCore\.App\.Runtime\.win-x64/[0-9.]+$' })
          if ($extractedPack.Count -ne 1 -or $extractedPack[0] -cne $pack[0]) { throw 'RUNTIMEPACK_IDENTITY_MISMATCH' }
          $packNotices = @()
          if (Test-Path -LiteralPath $packDir -PathType Container) {
            $packNotices = @(Get-ChildItem -LiteralPath $packDir -File | Where-Object { $_.Name -match '^(LICENSE|THIRD.?PARTY.?NOTICES)' } | ForEach-Object {
              [pscustomobject]@{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
            })
          }
          Copy-Item -LiteralPath (Join-Path $packDir 'LICENSE.TXT') -Destination (Join-Path $evidence 'runtimepack-license.txt')
          Copy-Item -LiteralPath (Join-Path $packDir 'THIRD-PARTY-NOTICES.TXT') -Destination (Join-Path $evidence 'runtimepack-third-party-notices.txt')
          [pscustomobject]@{ identity = $pack[0]; directory_found = (Test-Path -LiteralPath $packDir -PathType Container); notices = $packNotices } |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'dotnet-runtimepack-notices.json') -Encoding utf8
          $alone = Join-Path $env:RUNNER_TEMP 'h454-service-isolated-probe'
          New-Item -ItemType Directory -Path $alone -ErrorAction Stop | Out-Null
          $isolatedExe = Join-Path $alone 'HermesCommanderNativeService.exe'
          Copy-Item -LiteralPath $serviceInMsi[0].FullName -Destination $isolatedExe
          $savedRoot = $env:DOTNET_ROOT
          $savedRootX64 = $env:DOTNET_ROOT_X64
          $savedLookup = $env:DOTNET_MULTILEVEL_LOOKUP
          try {
            $env:DOTNET_ROOT = $alone
            $env:DOTNET_ROOT_X64 = $alone
            $env:DOTNET_MULTILEVEL_LOOKUP = '0'
            $isolatedProbe = Start-Process -FilePath $isolatedExe -ArgumentList @('--self-test', $env:GITHUB_SHA) -WorkingDirectory $alone -WindowStyle Hidden -Wait -PassThru
            $isolatedProbe.ExitCode | Set-Content -LiteralPath (Join-Path $evidence 'isolated-service-exit-code.txt') -Encoding utf8
            if ($isolatedProbe.ExitCode -ne 0) { throw 'ISOLATED_SERVICE_SELF_TEST_FAILED' }
          } finally {
            $env:DOTNET_ROOT = $savedRoot
            $env:DOTNET_ROOT_X64 = $savedRootX64
            $env:DOTNET_MULTILEVEL_LOOKUP = $savedLookup
          }
          Write-Output 'UNSIGNED_SYNTHETIC_BUILD=PASS; SIGNED_RELEASE=NOT_RUN; ARTIFACT_PUBLISHED=NO'
      - name: Upload build metadata only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-metadata-not-binaries
          path: ${{ runner.temp }}/h454-build-evidence/
          retention-days: 7
          if-no-files-found: error
